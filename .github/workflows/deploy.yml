name: Deploy to Remote Server

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Select branch to deploy'
        required: true
        default: 'onstep'
        type: choice
        options:
          - onstep

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Setup SSH Key
        run: |
          echo "${{ secrets.DEPLOY_KEY }}" > deploy_key
          chmod 600 deploy_key
          mkdir -p ~/.ssh

      - name: Create Ansible Inventory File
        run: |
          echo "${{ secrets.deploy_server_inventory }}" > inventory.ini

      - name: Extract Host IP and Add to known_hosts
        run: |
          host_ip=$(awk '{print $1}' inventory.ini)
          echo "Connecting to IP: $host_ip"
          ssh-keyscan -H "$host_ip" >> ~/.ssh/known_hosts

      - name: Install Ansible
        run: |
          sudo apt update
          sudo apt install -y ansible

      - name: Sync Code to Server
        run: |
          host_ip=$(awk '{print $1}' inventory.ini)
          ansible "$host_ip" -i inventory.ini -m synchronize -a "src=./ dest=/home/deploy-folder/ delete=yes recursive=yes" \
            --private-key=deploy_key

      - name: Build Frontend and Deploy to /var/www/html/shark
        run: |
          host_ip=$(awk '{print $1}' inventory.ini)
          ansible "$host_ip" -i inventory.ini -m shell -a "\
            cd /home/deploy-folder/apps/frontend && \
            npm install && \
            npx vite build && \
            sudo mkdir -p /var/www/html/shark && \
            sudo rm -rf /var/www/html/shark/* && \
            sudo cp -r dist/* /var/www/html/" \
            --private-key=deploy_key
