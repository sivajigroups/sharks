name: Test EC2 SSH Connection

on:
  push:
    branches:
      - ssh-test
  workflow_dispatch:

jobs:
  ssh-test:
    runs-on: ubuntu-latest

    steps:
    - name: Set up environment variables
      run: |
        echo "${{ secrets.EC2_PEM_KEY }}" > key.pem
        echo "EC2_HOST=${{ secrets.EC2_HOST }}" >> $GITHUB_ENV
        echo "EC2_USER=${{ secrets.EC2_USER }}" >> $GITHUB_ENV

    - name: Configure SSH
      run: |
        mkdir -p ~/.ssh
        mv key.pem ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

    - name: Connect to EC2
      run: |
        echo "Connecting to $EC2_USER@$EC2_HOST..."
        ssh -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST "echo 'Connected to EC2'"
