name: Test EC2 SSH Connection

on:
  push:
    branches:
      - ssh-test
  workflow_dispatch:

jobs:
  ssh-test:
    runs-on: ubuntu-latest

    steps:
    - name: ✅ DEBUG: Check if EC2_HOST is set
      run: |
        if [ -z "${{ secrets.EC2_HOST }}" ]; then
          echo "❌ EC2_HOST is EMPTY"
          exit 1
        else
          echo "✅ EC2_HOST is set"
        fi

    - name: 🔐 Setup SSH with PEM
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_PEM_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        echo "${{ secrets.EC2_HOST }}" | tee -a ~/.ssh/known_hosts > /dev/null
        ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

    - name: 🚀 Connect to EC2 and test
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "echo '✅ Connected to EC2!'"
