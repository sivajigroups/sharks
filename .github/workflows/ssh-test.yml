name: Test EC2 SSH Connection

on:
  push:
    branches:
      - ssh-test
  workflow_dispatch:

jobs:
  ssh-test:
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_PEM_KEY: ${{ secrets.EC2_PEM_KEY }}

    steps:
    - name: ✅ DEBUG: Check if EC2_HOST is set
      run: |
        if [ -z "$EC2_HOST" ]; then
          echo "❌ EC2_HOST is EMPTY"
          exit 1
        else
          echo "✅ EC2_HOST is set to: $EC2_HOST"
        fi

    - name: 🔐 Setup SSH with PEM
      run: |
        mkdir -p ~/.ssh
        echo "$EC2_PEM_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

    - name: 🚀 Connect to EC2 and test
      run: |
        ssh -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST "echo '✅ Connected to EC2!'"
