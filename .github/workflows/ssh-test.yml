name: Dump EC2 Secrets to Files

on:
  push:
    branches:
      - ssh-test
  workflow_dispatch:

jobs:
  ssh-test:
    runs-on: ubuntu-latest

    steps:
    - name: Create SSH key and connect
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_PEM_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa

        echo "Host ec2-target" >> ~/.ssh/config
        echo "  HostName ${{ secrets.EC2_HOST }}" >> ~/.ssh/config
        echo "  User ${{ secrets.EC2_USER }}" >> ~/.ssh/config
        echo "  IdentityFile ~/.ssh/id_rsa" >> ~/.ssh/config
        echo "  StrictHostKeyChecking no" >> ~/.ssh/config

        ssh ec2-target "echo 'Connected to EC2 without ssh-keyscan'"