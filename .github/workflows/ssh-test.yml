name: Dump EC2 Secrets to Files

on:
  push:
    branches:
      - ssh-test
  workflow_dispatch:

jobs:
  dump-secrets:
    runs-on: ubuntu-latest

    steps:
    - name: Dump EC2 secrets to files
      run: |
        mkdir dump
        echo "${{ secrets.EC2_HOST }}" > dump/ec2_host.txt
        echo "${{ secrets.EC2_USER }}" > dump/ec2_user.txt
        echo "${{ secrets.EC2_PEM_KEY }}" > dump/ec2_key.pem
        echo "Files created: ec2_host.txt, ec2_user.txt, ec2_key.pem"
    
    - name: Show contents (host and user only)
      run: |
        echo "EC2_HOST: $(cat dump/ec2_host.txt)"
        echo "EC2_USER: $(cat dump/ec2_user.txt)"
    
    - name: Upload for download (PEM not shown for security)
      uses: actions/upload-artifact@v4
      with:
        name: ec2-secrets-dump
        path: dump/
