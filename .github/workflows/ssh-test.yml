name: Dump EC2 Secrets to Files

on:
  push:
    branches:
      - ssh-test
  workflow_dispatch:

jobs:
  ssh-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Load secrets from files
      run: |
        mkdir -p ~/.ssh
        cp secrets/ec2_key.pem ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa

        export EC2_HOST=$(cat secrets/ec2_host.txt)
        export EC2_USER=$(cat secrets/ec2_user.txt)

        echo "Connecting to $EC2_USER@$EC2_HOST"
        ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
        ssh -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" "echo 'Connected via file-based secrets'"
